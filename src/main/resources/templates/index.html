<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Todoリスト</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body> 
	<h1 class="title" th:text="${now + ' Todoリスト'}">  Todoリスト</h1>

	<form action="/todo/new">
	<button class="btn-base btn-add">Todo登録</button>
	</form>

<table class="table"><tr>
  
    <tr th:if="${! #lists.isEmpty(todos)}"><th>チェック</th><th>Todo</th><th>カテゴリ</th></tr>
        <tr th:each="todo : ${todos}">
            <td class="td"><input type="checkbox"></td>
            <td class="td"><a th:text="${todo.name}" th:href="@{'/todo/'+${todo.id}+'/edittodo'}"></a></td>
            <td class="td" th:text="${todo.style}"></td>
        </tr>

</table>
</body>
</html>
