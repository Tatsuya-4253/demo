<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>todo編集</title>
    <style>
        body {
            width: 500px;
            margin: 0 auto;
            background-color: bisque;
        }

        h1 {
            background-color: brown;
            color: white;
        }

        .ex {
            height: 20px;

        }
    </style>
</head>

<body>
    <h1>todo編集・削除</h1>
    <form th:action="@{'/todo/' + ${todo.id}}" method="post">
        <table border="1">
            <tr>
                <th>カテゴリ</th>
                <td>
                    <select name="style">
                        <option value="0">---</option>
                        <option value="1" th:selected="${todo.style == '1'}">仕事</option>
                        <option value="2" th:selected="${todo.style == '2'}">プライベート</option>
                        <option value="3" th:selected="${todo.style == '3'}">その他</option>
                    </select>
                </td>
            </tr>

            <tr class="ex">
                <th>内容</th>
                <td><textarea rows="6" cols="12" name="name" th:text="${todo.name}"></textarea></td>
            </tr>


        </table><br>

        <button>編集</button>
    </form>

    <form th:action="@{'/todo/' + ${todo.id} + '/delete'}" method="post" onsubmit="return confirm('このTodoを削除します。よろしいですか？')">
        <button>削除</button>
    </form>

    <br>
    <a href="/todo">一覧へ戻る</a>

</body>

</html>
