<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <title>登録フォーム</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <h1 class="title">登録フォーム</h1>
    <ul th:each="err:${errList}">
        <li th:text="${err}" style="color: red;"></li>
    </ul>
    <form action="/todo" method="post">
        <table class="table">
            <tr>
                <th class="th">カテゴリ</th>
                <td class="td">
                    <select name="style">
                        <option value="0" th:selected="${style == '0'}">---</option>
                        <option value="1" th:selected="${style == '1'}">仕事</option>
                        <option value="2" th:selected="${style == '2'}">プライベート</option>
                        <option value="3" th:selected="${style == '3'}">その他</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th class="th">内容</th>
                <td class="td"><textarea rows="6" cols="12" name="name" th:text="${name}"></textarea></td>
            </tr>


        </table><br>

        <button class="btn-base btn-add">登録</button>
    </form>
    <br>
    <a href="/todo" class="btn-back">一覧へ戻る</a>

</body>

</html>
